name: Flutter CI/CD

on:
  push:
    branches:
      - test-app
      - main
  pull_request:
    branches:
      - test-app
      - main
  workflow_dispatch: # Memungkinkan jalankan workflow secara manual dari GitHub Actions UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: CI (Lint, Analyze, and Unit/Widget Tests)
  # -------------------------------------------------------------
  test:
    name: Code Analysis & Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔍 Analyze Code (Linter)
        run: flutter analyze

      - name: 🧪 Run Automated Tests
        run: flutter test --coverage

  # -------------------------------------------------------------
  # Job 2: CD (Build Android APK & Upload as GitHub Artifact)
  # -------------------------------------------------------------
  build_apk:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔨 Build Release APK
        run: flutter build apk --release

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sikarir-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
